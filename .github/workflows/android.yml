
name: Build SONIC 962 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Accept Android licenses and build APK
        run: |
          set +o pipefail
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONIC-962-APK
          path: bin/*.apk
